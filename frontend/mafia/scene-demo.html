<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scene.js dev harness</title>
<!--
  Dev harness for scene.js only (not the shipped page). It replays a game's events through scene.handle
  with its own tiny reducer, so it does not depend on state.js / main.js / ui.js.

  Headless screenshot or DOM dump, in real time (hold=1 makes Chrome wait until the scene is ready):
    chrome --headless=new --window-size=1440,900 --screenshot=out.png \
      "http://127.0.0.1:8101/scene-demo.html?at=34&reveal=1&hud=0&hold=1"
  Do not use --virtual-time-budget: the clock then runs ahead of texture decoding and shader
  compilation, and the capture is often taken before the first picture.

  URL parameters (all optional):
    game=demo        game folder under /games/ (default demo)
    n=10             ignore the game and fake a table of n players with a short scripted game (town wins;
                     add win=mafia for a short game that the mafia win at night)
    at=24            sync to the state after that many events (default 0)
    step=2           then pass the next 2 events to handle() at once
    run=20           then replay the next 20 events on the event clock, synchronously (scene time is
                     stepped by hand, so a headless screenshot gets exactly the same result every time)
    gap=0.2          with run: pass the events a fixed 0.2 s apart instead of on the event clock
    ff=1.5           then let 1.5 more seconds of scene time pass (also stepped by hand)
    play=1           then keep playing the remaining events in real time
    speed=4          playback speed (also passed to setSpeed)
    reveal=1         god view            skin=robots     tod=day|night
    follow=1         follow the speaker  focus=Riley     ease the camera to a player
    cam=az,el,dist   fixed camera in degrees and world units; add ,x,y,z for the look-at point
    fail=1           point the scene at a missing asset folder to see the simple-geometry fallback
    assets=/x/       load the models from another folder
    do=reveal:0,ff:1 extra steps applied last, in order: reveal:0|1, skin:<name>, tod:day|night|auto, follow:0|1,
                     speed:<n>, focus:<name>, step:<k>, ff:<seconds>, sync (re-sync at the current event),
                     click:<name>:label|body|house|grave or click:<x>x<y> (a pointer click on the canvas),
                     fuzz (throw junk at every API call; nothing may break),
                     poses (one viewer action per character: idle, walk, talk, agree, die, celebrate, sit)
    info=1           print draw calls, triangles, start-up timings, request counts and the WebGL renderer in the control bar
    fps=3            then run for 3 s of real time and add the measured frames per second
    box=390x844      give the scene a container of exactly that size (headless Chrome on Windows will not
                     open a window narrower than about 500 px, so --window-size alone cannot test a phone)
    banners=0        do not ask the scene for its own text banners (the shipped page leaves them to ui.js)
    hold=1           for headless Chrome, which captures at the window load event: keep that event back until
                     every step above has run, and stop the scene's own clock so that only step/run/ff/do
                     move time. No --virtual-time-budget is needed then and a shot is the same on every run.
    hud=0            hide the control bar
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d1322; overflow: hidden; font: 13px Inter, system-ui, sans-serif; color: #e8ebf3; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px; background: rgba(12, 15, 25, .78); backdrop-filter: blur(8px); }
  #hud button, #hud select { font: inherit; color: inherit; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  #hud label { display: flex; align-items: center; gap: 4px; }
  #where { font-variant-numeric: tabular-nums; min-width: 64px; }
  #what { flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  #err { position: fixed; left: 8px; top: 8px; right: 8px; z-index: 99; white-space: pre-wrap; color: #ffb4b4; background: rgba(60, 0, 0, .85); padding: 6px 10px; border-radius: 6px; font: 12px ui-monospace, monospace; }
  #err:empty { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="err"></div>
<div id="hud">
  <button id="first" title="first event">|&lt;</button><button id="prev">&lt;</button>
  <button id="toggle">play</button>
  <button id="next">&gt;</button><button id="last" title="last event">&gt;|</button>
  <span id="where"></span>
  <select id="speed"><option>1</option><option>4</option><option>16</option></select>
  <label><input type="checkbox" id="reveal"> reveal</label>
  <label><input type="checkbox" id="follow"> follow</label>
  <select id="skin"><option>villagers</option><option>robots</option></select>
  <select id="tod"><option value="">follow game</option><option>day</option><option>night</option></select>
  <span id="what"></span>
</div>
<script type="module">
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const say = m => { $('err').textContent += m + '\n'; release(); };
// An iframe whose document is left open counts as still loading, which keeps the window load event back.
const held = q.get('hold') === '1' ? document.body.appendChild(document.createElement('iframe')) : null;
if (held) { held.style.display = 'none'; held.contentDocument.open(); }
function release() { if (held?.isConnected) { held.contentDocument.close(); held.remove(); } }
addEventListener('error', e => say(e.message));
addEventListener('unhandledrejection', e => say(String(e.reason?.message || e.reason)));
const consoleError = console.error;
console.error = (...a) => { consoleError(...a); say(a.map(x => x?.stack || x?.message || String(x)).join(' ')); };

const PALETTE = ['#f2c14e', '#4ea8de', '#b388eb', '#ff8c42', '#3ddbd9', '#f78fb3', '#a3d977', '#c9ada7'];

/** A short scripted game for a table of n players, so any table size can be looked at. */
function fakeGame(n) {
  const names = ['Ada', 'Bram', 'Cleo', 'Dax', 'Esme', 'Finn', 'Gwen', 'Hugo', 'Iris', 'Jude', 'Kit', 'Lena', 'Milo', 'Nia', 'Otto', 'Pia'];
  const models = ['openai/gpt-5', 'anthropic/claude-opus-5.5', 'google/gemini-3-pro', 'meta-llama/llama-3.3-70b-instruct', 'x-ai/grok-4', 'mistralai/mistral-large', 'mock'];
  const role = i => i === 1 || (n >= 8 && i === 5) ? 'mafia' : i === 2 ? 'detective' : i === 3 ? 'doctor' : 'villager';
  const players = [...Array(n)].map((_, i) => ({ name: names[i] || 'P' + i, model: models[i % models.length], role: role(i), color: PALETTE[i % PALETTE.length] }));
  if (n < 4) return { players, events: [] };   // below the smallest real table: just the village
  const mafia = players.filter(p => p.role === 'mafia'), ev = []; let ts = 0;
  const emit = (dt, type, data) => ev.push({ ts: ts += dt, type, ...data });
  const alive = new Set(players.map(p => p.name));
  // two hostile lines on purpose: markup must show up as plain text, and a long message must stay readable
  const lines = ['who is acting weird already', '<img src=x onerror="document.title=`XSS`"><b>bold?</b> <script>alert(1)<\/script>', 'that is exactly what mafia would say',
    'yeah agreed, something is off', 'ok hear me out. ' + 'i have been tracking every vote and every pause and it all points one way, '.repeat(5) + 'so vote with me.', 'i am just reading for now'];
  const day = (round, target) => {
    emit(2, 'phase', { phase: 'day', round, duration: 60 });
    [...alive].forEach((name, i) => emit(3, 'message', { name, text: lines[i % lines.length], phase: 'day' }));
    emit(4, 'vote_open', { phase: 'day', round });
    for (const name of alive) emit(1, 'vote', { voter: name, target: name === target ? [...alive][0] : target, phase: 'day' });
    alive.delete(target);
    emit(1, 'eliminated', { name: target, role: players.find(p => p.name === target).role, cause: 'vote' });
  };
  const nightTime = (round, target, save) => {
    const m = mafia.filter(p => alive.has(p.name));
    emit(2, 'phase', { phase: 'night', round, duration: m.length > 1 ? 30 : 0 });
    if (m.length > 1) m.forEach(p => emit(3, 'message', { name: p.name, text: `take ${target} tonight`, phase: 'night' }));
    emit(3, 'vote_open', { phase: 'night', round });
    m.forEach(p => emit(1, 'vote', { voter: p.name, target, phase: 'night' }));
    if (alive.has(players[2].name)) emit(2, 'investigate', { detective: players[2].name, target: m[0].name, is_mafia: true });
    if (alive.has(players[3].name)) emit(1, 'protect', { doctor: players[3].name, target: save ? target : players[3].name });
    if (save) emit(1, 'saved', { name: target });
    else { alive.delete(target); emit(1, 'eliminated', { name: target, role: players.find(p => p.name === target).role, cause: 'night' }); }
  };
  if (q.get('win') === 'mafia') {   // a mafia win that ends at night, right after the kill
    day(1, players[n - 1].name); nightTime(1, players[0].name, false); emit(1, 'game_over', { winner: 'mafia' });
    return { players, events: ev };
  }
  day(1, players[n - 1].name); nightTime(1, players[0].name, true);
  day(2, mafia[0].name);
  if (mafia.length > 1) { nightTime(2, players[2].name, false); day(3, mafia[1].name); }
  emit(1, 'game_over', { winner: 'town' });
  return { players, events: ev };
}

async function loadGame(id) {
  const config = await (await fetch(`/games/${id}/config.json`, { cache: 'no-store' })).json();
  const text = await (await fetch(`/games/${id}/events.jsonl`, { cache: 'no-store' })).text();
  const players = config.players.map((p, i) => ({
    name: p.name, model: p.llm_config?.model_name ?? '', role: p.is_mafia ? 'mafia' : (p.special_role || 'villager'), color: PALETTE[i % PALETTE.length],
  }));
  const events = text.slice(0, text.lastIndexOf('\n') + 1).split('\n').filter(Boolean).map(l => JSON.parse(l));
  return { players, events };
}

/** The harness's own reducer: the snapshot after the first `count` events (shape from CONTRACT.md). */
function snapshot(players, events, count) {
  const s = { phase: 'day', round: 1, voting: false, players: {}, votes: [], protect: null, investigate: null, winner: null };
  for (const p of players) s.players[p.name] = { alive: true, cause: null };
  for (const e of events.slice(0, count)) {
    if (e.type === 'phase') Object.assign(s, { phase: e.phase, round: e.round, voting: false, votes: [], protect: null, investigate: null });
    else if (e.type === 'vote_open') Object.assign(s, { voting: true, votes: [] });
    else if (e.type === 'vote') s.votes = s.votes.filter(v => v.voter !== e.voter).concat({ voter: e.voter, target: e.target });
    else if (e.type === 'investigate') s.investigate = { detective: e.detective, target: e.target, is_mafia: e.is_mafia };
    else if (e.type === 'protect') s.protect = { doctor: e.doctor, target: e.target };
    else if (e.type === 'eliminated') { s.players[e.name] = { alive: false, cause: e.cause }; s.voting = false; s.votes = []; }
    else if (e.type === 'saved') { s.voting = false; s.votes = []; }
    else if (e.type === 'game_over') s.winner = e.winner;
  }
  return s;
}

if (q.get('box')) { const [bw, bh] = q.get('box').split('x'); Object.assign($('stage').style, { inset: 'auto', left: '0', top: '0', width: bw + 'px', height: bh + 'px' }); }
const t0 = performance.now();
const { createScene } = await import('./scene.js');
const t1 = performance.now();
const game = q.has('n') ? fakeGame(Math.max(0, +q.get('n') || 0)) : await loadGame(q.get('game') || 'demo');
const { players, events } = game, clicks = [];
const scene = await createScene($('stage'), {
  players, banners: q.get('banners') !== '0', onPlayerClick: name => { clicks.push(name); $('what').textContent = `clicked ${clicks.join(', ')}`; scene.focus(name); },
  ...(q.get('fail') ? { assetBase: '/no-such-folder/' } : q.get('assets') ? { assetBase: q.get('assets') } : {}),
});
window.scene = scene;
const t2 = performance.now();
scene._dev.manual = !!held && q.get('play') !== '1';

let at = clamp(+q.get('at') || 0), timer = null, speed = +q.get('speed') || 1;
function clamp(i) { return Math.max(0, Math.min(events.length, i)); }
function describe(e) {
  if (!e) return 'start';
  const { ts, type, ...rest } = e;
  return `${type} ${Object.values(rest).join(' · ')}`;
}
function show() { $('where').textContent = `${at} / ${events.length}`; $('what').textContent = describe(events[at - 1]); }
function jump(i) { stop(); at = clamp(i); scene.sync(snapshot(players, events, at)); show(); }
function step() { if (at < events.length) { scene.handle(events[at]); at++; show(); } }
function stop() { clearTimeout(timer); timer = null; $('toggle').textContent = 'play'; }
function play() {
  if (at >= events.length) return stop();
  $('toggle').textContent = 'pause';
  const gap = at === 0 ? 0 : Math.min(8, events[at].ts - events[at - 1].ts);
  timer = setTimeout(() => { step(); play(); }, gap * 1000 / speed);
}

$('first').onclick = () => jump(0); $('last').onclick = () => jump(events.length);
$('prev').onclick = () => jump(at - 1); $('next').onclick = () => { stop(); step(); };
$('toggle').onclick = () => timer ? stop() : play();
$('speed').onchange = e => { speed = +e.target.value; scene.setSpeed(speed); };
$('reveal').onchange = e => scene.setReveal(e.target.checked);
$('follow').onchange = e => scene.setFollowSpeaker(e.target.checked);
$('skin').onchange = e => scene.setSkin(e.target.value);
$('tod').onchange = e => scene.setTimeOfDay(e.target.value || null);

// URL parameters, applied in the order main.js would: setters first, then sync, then events
if (q.get('hud') === '0') $('hud').hidden = true, $('hud').style.display = 'none';
$('speed').value = String(speed); scene.setSpeed(speed);
if (q.get('reveal') === '1') { $('reveal').checked = true; scene.setReveal(true); }
if (q.get('skin')) { $('skin').value = q.get('skin'); scene.setSkin(q.get('skin')); }
if (q.get('tod')) { $('tod').value = q.get('tod'); scene.setTimeOfDay(q.get('tod')); }
if (q.get('follow') === '1') { $('follow').checked = true; scene.setFollowSpeaker(true); }
jump(at);
if (q.get('cam')) {
  const [az, el, dist, x = 0, y = 1.4, z = 0] = q.get('cam').split(',').map(Number), { camera, controls } = scene._dev, r = Math.PI / 180;
  controls.dispatchEvent({ type: 'start' });   // counts as the user taking the camera, so nothing resets it
  controls.target.set(x, y, z); controls.autoRotateSpeed = 0;
  camera.position.set(Math.sin(az * r) * Math.cos(el * r), Math.sin(el * r), Math.cos(az * r) * Math.cos(el * r)).multiplyScalar(dist).add(controls.target);
}
for (let i = +q.get('step') || 0; i > 0; i--) step();
for (let i = +q.get('run') || 0; i > 0 && at < events.length; i--) {
  if (at > 0) scene._dev.advance(q.has('gap') ? +q.get('gap') : Math.min(8, events[at].ts - events[at - 1].ts) / speed);
  step();
}
if (q.get('focus')) scene.focus(q.get('focus'));
if (q.get('ff')) scene._dev.advance(+q.get('ff'));
for (const [k, v] of (q.get('do') || '').split(',').filter(Boolean).map(s => [s.split(':')[0], s.split(':').slice(1).join(':')])) {
  if (k === 'reveal') scene.setReveal(v === '1'); else if (k === 'skin') scene.setSkin(v); else if (k === 'tod') scene.setTimeOfDay(v === 'auto' ? null : v);
  else if (k === 'follow') scene.setFollowSpeaker(v === '1'); else if (k === 'speed') scene.setSpeed(speed = +v); else if (k === 'focus') scene.focus(v);
  else if (k === 'step') { for (let i = +v; i > 0; i--) step(); } else if (k === 'ff') scene._dev.advance(+v); else if (k === 'sync') scene.sync(snapshot(players, events, at));
  else if (k === 'click') {   // click:<name>:label|body|house|grave, or click:<x>x<y>: a real pointer click on the canvas at that spot
    const canvas = document.querySelector('.scn-root canvas'), box = canvas.getBoundingClientRect(), [who, part] = v.split(':'), a = scene._dev.actors.find(o => o.name === who);
    let x, y;
    if (!a) [x, y] = who.split('x').map(Number);
    else if (part === 'label') { const r = a.label.obj.element.querySelector('.scn-tag').getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    else {
      const p = part === 'house' ? a.seat.group.position.clone().setY(a.seat.top * 0.5) : part === 'grave' ? a.seat.grave.getWorldPosition(a.group.position.clone()).setY(0.9) : a.group.position.clone().setY(1.4);
      p.project(scene._dev.camera); x = box.left + (p.x + 1) / 2 * box.width; y = box.top + (1 - p.y) / 2 * box.height;
    }
    for (const type of ['pointerdown', 'pointerup']) canvas.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, button: 0, bubbles: true, pointerId: 1 }));
  }
  else if (k === 'poses') {   // one viewer action per character, to check every clip in the current skin
    ['idle', 'walk', 'talk', 'agree', 'die', 'celebrate', 'sit'].forEach((action, i) => {
      const a = scene._dev.actors[i]; if (!a) return;
      a.label.say(action);
      if (action === 'walk') a.walk([a.group.position.clone().multiplyScalar(0.3)], 'idle', a.yaw);
      else if (action === 'talk' || action === 'agree') a.rig.gesture(action); else a.setBase(action);
    });
  }
  else if (k === 'fuzz') {   // nothing here may throw or print an error
    for (const junk of [undefined, null, 42, 'x', {}, { type: 'vote' }, { type: 'vote', voter: 'nobody', target: 42 }, { type: 'message', name: players[0].name }, { type: 'eliminated', name: 'ghost' },
      { type: 'investigate' }, { type: 'protect', doctor: 7, target: null }, { type: 'saved' }, { type: 'phase', phase: 'dusk', round: 'x' }, { type: 'unknown', foo: 1 }]) scene.handle(junk);
    for (const junk of [undefined, null, 'x', {}, { players: null, votes: 'no', protect: 5, investigate: [] }, { phase: 'night', votes: [null, { voter: 'a' }], players: { nobody: { alive: false } }, protect: { doctor: 'x', target: 'y' }, investigate: { detective: 'x', target: 'y' } }]) scene.sync(junk);
    scene.setSkin('dragons'); scene.setSkin(null); scene.setSpeed(NaN); scene.setSpeed(-5); scene.setTimeOfDay('noon'); scene.focus('nobody'); scene.focus(); scene.setReveal('yes'); scene.setFollowSpeaker(1); scene.setFollowSpeaker(0);
    scene.setReveal(false); scene.setSpeed(speed); scene.setTimeOfDay(null); scene.sync(snapshot(players, events, at));
  }
}
if (q.get('info')) {
  const i = scene._dev.renderer.info, gl = scene._dev.renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info'), t = scene._dev.timing, ms = v => Math.round(v) + ' ms';
  i.autoReset = false; i.reset(); const f0 = performance.now(); scene._dev.advance(0); const f1 = performance.now(); i.autoReset = true;
  const res = performance.getEntriesByType('resource'), local = res.filter(r => r.name.startsWith(location.origin)), cdn = res.filter(r => !r.name.startsWith(location.origin));
  $('what').textContent = `calls ${i.render.calls} · triangles ${i.render.triangles} · programs ${i.programs.length} · geometries ${i.memory.geometries} · textures ${i.memory.textures}`
    + ` | page start to module ${ms(t0)} · import scene.js + three ${ms(t1 - t0)} · createScene ${ms(t2 - t1)} (assets ${ms(t.assets)}, build ${ms(t.build)}, shader compile ${ms(t.compile)}, first frame ${ms(t.firstFrame)}) · a later frame ${ms(f1 - f0)}`
    + ` | requests: ${local.length} local, ${cdn.length} cdn | ${ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'renderer unknown'}`;
}
if (q.get('play') === '1') play();
if (q.get('fps')) {   // let the scene run on its own clock for that many seconds and report frames per second and the longest frame
  scene._dev.manual = false;
  await new Promise(done => {
    const wait = +q.get('fps') * 1000, begin = performance.now(); let n = -1, start = 0, last = 0, worst = 0, stall = 0;
    requestAnimationFrame(function tick(now) {
      if (n < 0) {   // warm-up: the first frames wait for the GPU to finish compiling shaders
        stall = Math.max(stall, now - (last || begin)); last = now;
        if (now - begin > 1500) { n = 0; start = now; }
        return requestAnimationFrame(tick);
      }
      n++; worst = Math.max(worst, now - last); last = now;
      if (now - start < wait) return requestAnimationFrame(tick);
      $('what').textContent += ` | ${(n * 1000 / (now - start)).toFixed(1)} fps over ${+q.get('fps')} s (longest frame ${Math.round(worst)} ms) after a 1.5 s warm-up (longest frame ${Math.round(stall)} ms), resolution scale now ${scene._dev.pace.quality.toFixed(2)}`;
      done();
    });
  });
}
requestAnimationFrame(() => requestAnimationFrame(release));   // after the last picture is on screen
</script>
</body>
</html>
