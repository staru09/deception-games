<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LLMafia viewer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<!-- scene.js imports Three.js through this map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.2"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 19 9 12 19 5 19 19" fill="currentColor"/><path d="M5 19V5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 5 15 12 5 19 5 5" fill="currentColor"/><path d="M19 5v14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
  </defs>
</svg>

<div class="app" id="app" data-phase="day" data-view="town" hidden>

  <header class="topbar glass">
    <span class="brand">LLMafia</span>

    <div class="phase" id="phase">
      <svg class="ic phase-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      <svg class="ic phase-moon" aria-hidden="true"><use href="#i-moon"/></svg>
      <span class="phase-name" id="phase-name"></span>
      <span class="phase-clock" id="phase-clock"></span>
    </div>

    <div class="counts" role="group" aria-label="Players still alive">
      <span class="count town"><b id="n-town">0</b> town</span>
      <span class="count maf"><b id="n-mafia">0</b> mafia</span>
    </div>

    <label class="picker">
      <span class="sr">Game</span>
      <select id="picker"></select>
    </label>

    <div class="toggles" role="group" aria-label="View options">
      <div class="seg" role="group" aria-label="Lighting">
        <button type="button" class="btn needs-scene" data-tod="day" aria-pressed="false" aria-label="Force daylight" title="Force daylight (click again: lighting follows the game)"><svg class="ic" aria-hidden="true"><use href="#i-sun"/></svg></button>
        <button type="button" class="btn needs-scene" data-tod="night" aria-pressed="false" aria-label="Force night" title="Force night (click again: lighting follows the game)"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
      </div>
      <button type="button" class="btn" id="reveal" aria-pressed="false" aria-label="Reveal roles" title="Reveal roles (god view)"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg><span class="lbl">Reveal roles</span></button>
      <button type="button" class="btn" id="voice" aria-pressed="true" aria-label="Narrator voice" title="Narrator voice (plays at 1× speed)"><svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg><span class="lbl">Narrator voice</span></button>
      <button type="button" class="btn needs-scene" id="follow" aria-pressed="false" aria-label="Follow speaker" title="Camera follows whoever speaks"><svg class="ic" aria-hidden="true"><use href="#i-video"/></svg><span class="lbl">Follow speaker</span></button>
    </div>
  </header>

  <main class="stage" id="stage" aria-label="Village">
    <div class="scene" id="scene"></div>
    <div class="placeholder" id="placeholder">
      <p class="placeholder-title" id="placeholder-title">Loading the village…</p>
      <p class="placeholder-sub" id="placeholder-sub"></p>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="winner" id="winner" role="status" hidden>
      <strong id="winner-title"></strong>
      <span id="winner-sub"></span>
    </div>
    <dialog class="card glass" id="card" aria-labelledby="card-name">
      <header class="card-head">
        <span class="dot dot-lg" id="card-dot"></span>
        <div class="card-id">
          <h2 id="card-name"></h2>
          <div class="card-model" id="card-model"></div>
        </div>
        <button type="button" class="btn icon-btn" id="card-close" aria-label="Close player card"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
      </header>
      <div class="card-body">
        <div id="card-facts"></div>
        <section class="traces" aria-labelledby="traces-title">
          <h3 id="traces-title">Reasoning</h3>
          <div id="card-traces"></div>
        </section>
      </div>
    </dialog>
  </main>

  <section class="dock glass" aria-label="Players and playback">
    <div class="roster" id="roster" role="group" aria-label="Players"></div>
    <div class="timeline" role="group" aria-label="Playback">
      <div class="transport">
        <button type="button" class="btn icon-btn" id="prev" aria-label="Previous event" title="Previous event (←)"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg></button>
        <button type="button" class="btn icon-btn play" id="play" aria-label="Play" title="Play or pause (space)"><svg class="ic" aria-hidden="true"><use id="play-icon" href="#i-play"/></svg></button>
        <button type="button" class="btn icon-btn" id="next" aria-label="Next event" title="Next event (→)"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
      </div>
      <div class="track" id="track">
        <div class="track-bg"><div class="track-dim"></div></div>
        <div class="track-marks" id="marks"></div>
        <input type="range" id="scrub" min="0" max="0" step="1" value="0" aria-label="Timeline, in events">
      </div>
      <span class="pos" id="pos" aria-hidden="true">0 / 0</span>
      <div class="seg" role="group" aria-label="Playback speed">
        <button type="button" class="btn" data-speed="1" aria-pressed="true" aria-label="Speed 1×">1×</button>
        <button type="button" class="btn" data-speed="4" aria-pressed="false" aria-label="Speed 4×">4×</button>
        <button type="button" class="btn" data-speed="16" aria-pressed="false" aria-label="Speed 16×">16×</button>
      </div>
      <button type="button" class="btn live" id="live" hidden><span class="live-dot" aria-hidden="true"></span>LIVE</button>
    </div>
  </section>

  <aside class="chat glass" id="chat" aria-label="Chat">
    <button type="button" class="sheet-grip" id="sheet-grip" aria-expanded="false" aria-controls="thread">
      <svg class="ic" aria-hidden="true"><use href="#i-up"/></svg>
      <span class="sr">Expand or collapse the chat</span>
    </button>
    <header class="chat-head">
      <h2>Chat</h2>
      <span class="view-badge" id="view-badge">Town view</span>
    </header>
    <div class="thread" id="thread" role="log" aria-label="Game chat" tabindex="0"></div>
    <button type="button" class="btn latest" id="latest" hidden><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg>Latest</button>
  </aside>
</div>

<section class="empty glass" id="empty" aria-live="polite">
  <h1 id="empty-title">LLMafia</h1>
  <p id="empty-text">Loading…</p>
  <pre id="empty-code" hidden></pre>
  <p id="empty-more" hidden></p>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
