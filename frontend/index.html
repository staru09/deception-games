<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Arena</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common/arena.css">
<link rel="stylesheet" href="dashboard/dashboard.css">
</head>
<body>

<header class="top">
  <a class="brand" href="#"><span class="emblem" data-emblem="crown" aria-hidden="true"></span>Deception Arena</a>
  <span class="conn" id="conn" role="status"></span>
</header>

<main>
  <!-- #: every game -->
  <section id="home" aria-labelledby="hero-h">
    <div class="hero">
      <span class="crest" data-emblem="crest" aria-hidden="true"></span>
      <p class="eyebrow">AI against AI</p>
      <h1 id="hero-h">Deception Arena</h1>
      <p class="tagline">Four courts of intrigue where models bluff, scheme and betray one another. Choose a table.</p>
      <div class="flourish" aria-hidden="true"><span>◆</span></div>
      <p class="tally" id="tally"></p>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- #<game>: one game's stats, the New run panel and its launchers -->
  <section id="game" hidden>
    <a class="back" href="#">← All games</a>
    <header class="game-head">
      <h1><span class="emblem" id="g-emblem" aria-hidden="true"></span><span id="g-title"></span></h1>
      <p class="muted" id="g-desc"></p>
      <dl class="stats" id="g-stats"></dl>
      <a class="enter" id="g-viewer" href="#">Open the viewer</a>
    </header>
    <div class="cols">
      <section class="glass panel" aria-labelledby="nr-h">
        <h2 id="nr-h">New run</h2>
        <label class="field">Start from a saved table <select id="nr-table"></select></label>
        <div class="seats" id="nr-seats" role="group" aria-label="Seats"></div>
        <button type="button" class="btn" id="nr-add">Add seat</button>
        <div class="row" id="nr-options"></div>
        <div class="row">
          <label class="field">Games <input id="nr-games" type="number" min="1" max="50" value="1" inputmode="numeric"></label>
          <label class="field">Parallel <input id="nr-parallel" type="number" min="1" max="8" value="1" inputmode="numeric"></label>
        </div>
        <p id="nr-estimate"></p>
        <p class="muted small" id="nr-budget"></p>
        <button type="button" class="btn primary" id="nr-start">Start</button>
        <p class="status" id="nr-status" role="status"></p>
      </section>
    </div>

    <section class="glass panel launchers-panel" aria-labelledby="launchers-h">
      <h2 id="launchers-h">Launchers</h2>
      <div class="launchers" id="launchers"></div>
    </section>
  </section>
</main>

<dialog class="confirm" id="confirm" aria-labelledby="confirm-h">
  <form method="dialog">
    <h2 id="confirm-h">Start a paid run?</h2>
    <p id="confirm-text"></p>
    <ul class="mono small" id="confirm-models"></ul>
    <div class="row end">
      <button class="btn" value="cancel" autofocus>Cancel</button>
      <button class="btn primary" value="start">Start paid run</button>
    </div>
  </form>
</dialog>

<script type="module" src="dashboard/dashboard.js"></script>
</body>
</html>
